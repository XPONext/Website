h1: "Ihre Kunden fragen ChatGPT. Ihr Reisebüro sollte in der Antwort stehen."
lead: "Reiseplanung beginnt heute oft in einer KI. Wir arbeiten daran, dass Ihr Reisebüro genannt wird, wenn jemand nach einem Reisebüro in Ihrer Stadt fragt oder seine nächste Reise plant."

situationen_titel: "Wo Reisebüros heute unsichtbar sind"
situationen:
  - titel: "Die Frage nach dem Reisebüro vor Ort"
    text: "Jemand fragt ChatGPT, welches Reisebüro in seiner Stadt gut zu Kreuzfahrten berät. Genannt werden Portale und Ketten, nicht das Büro mit der besten Beratung."
  - titel: "Die Reiseplanung in der KI"
    text: "Eine Familie plant mit ChatGPT eine Reise nach Ägypten. Am Ende steht ein Buchungsportal in der Antwort, obwohl Ihr Büro genau diese Reise seit Jahren verkauft."
  - titel: "Die Google-Suche nach dem Reisebüro"
    text: "Bei der Suche „Reisebüro Köln“ standen am 6. Oktober 2026 auf den ersten zehn Plätzen nur Verzeichnisse und soziale Netzwerke. Kein einziges Reisebüro hatte dort einen eigenen Treffer."
situationen_quelle: "Stichprobe von XPONext, Google-Suche „Reisebüro Köln“ am 6. Oktober 2026, organische Treffer 1 bis 10."

schritte_titel: "So kommt Ihr Reisebüro in die Antworten"
schritte:
  - titel: "Ausgangsmessung"
    text: "Wir stellen Google, ChatGPT und Gemini einen festen Katalog typischer Fragen zu Reisebüros und Reisezielen in Ihrer Region und halten fest, wer genannt wird."
  - titel: "Seiten für Ihre Schwerpunkte"
    text: "Für Ihre Reiseziele und Beratungsthemen entstehen Seiten, die die Fragen Ihrer Kunden direkt beantworten, mit Ihrer Erfahrung statt Katalogtext."
  - titel: "Folgemessung"
    text: "Nach einigen Monaten stellen wir dieselben Fragen erneut. Sie sehen schwarz auf weiß, in wie vielen Antworten Ihr Büro vorher und nachher vorkommt."

einwaende_titel: "Was Reisebüros uns zuerst fragen"
einwaende:
  - titel: "Kostet mich das Zeit?"
    text: "Wenig. Wir brauchen von Ihnen Stichpunkte zu Ihren Schwerpunkten und ein, zwei Gespräche. Die Texte schreiben wir."
  - titel: "Muss meine Website neu?"
    text: "Nicht unbedingt. Oft reichen neue Seiten auf Ihrer bestehenden Website. Ob das bei Ihnen geht, prüfen wir vorab kostenlos."
  - titel: "Kann man das messen?"
    text: "Ja. Wir frieren den Fragenkatalog vor dem Start ein und stellen danach exakt dieselben Fragen. So lässt sich nichts schönrechnen."

beleg:
  titel: "Erfahrung in der Touristik"
