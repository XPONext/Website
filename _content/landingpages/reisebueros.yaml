  text: "Im Erstgespräch zeigen wir Ihnen, ob und wo Ihr Reisebüro heute in KI-Antworten vorkommt. Danach entscheiden Sie, ob wir loslegen."
  platzhalter: "Angebot für Reisebüros, sobald entschieden."

faq:
  - frage: "Was ist GEO?"
    antwort: "GEO (Generative Engine Optimization) ist die Arbeit daran, dass ein Unternehmen in den Antworten von KI-Suchmaschinen wie ChatGPT, Gemini oder Google AI Overviews genannt wird."
  - frage: "Funktioniert das auch für kleine Reisebüros?"
    antwort: "Gerade dort. Die KI nennt Reisebüros, die zu einer konkreten Frage passende Inhalte haben. Persönliche Beratung und echte Reiseerfahrung lassen sich gut zeigen, egal wie groß das Büro ist."

abschluss:
  titel: "Wird Ihr Reisebüro genannt? <em>Wir sehen nach.</em>"
  text: "Im Erstgespräch zeigen wir Ihnen, was ChatGPT und Google heute zu Reisebüros in Ihrer Stadt antworten."
