situationen_titel: "Was wir von Architekturbüros immer wieder hören"
situationen:
  - titel: "Aufträge kommen nur über Empfehlungen"
    text: "Über das Internet kommt wenig rein. Meist liegt das nicht am Internet, sondern daran, wo das Büro angezeigt wird, bei Google, in Google Maps und in KI-Antworten."
  - titel: "Die Website zeigt die Projekte nicht"
    text: "Die besten Projekte sind fotografiert, aber die Website ist alt, langsam oder auf dem Handy kaum zu bedienen."
  - titel: "Verwaltung frisst die Planung"
    text: "Protokolle, Mails, Angebote und die Einschätzung von Ausschreibungen binden Leute, die eigentlich planen sollten."

schritte_titel: "Was wir für Architekturbüros machen"
