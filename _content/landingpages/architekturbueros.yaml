angebot:
  titel: "So starten wir"
  text: "Im Erstgespräch sehen wir uns gemeinsam an, wo Ihr Büro bei Google und in KI-Antworten heute steht und wo im Alltag Zeit verloren geht. Danach bekommen Sie ein schriftliches Angebot."

faq:
  - frage: "Wie finden Auftraggeber heute ein Architekturbüro?"
    antwort: "Über Empfehlungen, über die Google-Suche und Google Maps und zunehmend über KI-Suchmaschinen wie ChatGPT. Wer dort nicht auftaucht, bekommt die Anfragen nicht, die nicht über das eigene Netzwerk laufen."
  - frage: "Was kostet eine Website für ein Architekturbüro?"
    antwort: "Eine Website ist ein einmaliges Projekt und liegt je nach Umfang meist im unteren bis mittleren vierstelligen Bereich. Den genauen Preis nennen wir nach dem Erstgespräch schriftlich."
  - frage: "Können Sie auch bei Ausschreibungen und Wettbewerben helfen?"
    antwort: "Bei der fachlichen Bewertung nicht, das bleibt Ihr Fach. Wir können aber Abläufe rund um Ausschreibungen beschleunigen, etwa das Sammeln und Zusammenfassen der Unterlagen."

