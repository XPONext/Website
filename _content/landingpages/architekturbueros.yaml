einwaende_titel: "Was Architekturbüros uns zuerst fragen"
einwaende:
  - titel: "Kennen Sie unsere Branche?"
    text: "Ja. Die meisten unserer Kunden sind Architektur- und Planungsbüros. HOAI und VOB bleiben Ihr Fach, die Werkzeuge und die Sichtbarkeit sind unseres."
  - titel: "Brauchen wir eine neue Website?"
    text: "Nicht immer. SEO, GEO und Google Ads lassen sich auch auf einer bestehenden Website aufsetzen. Wir sagen Ihnen ehrlich, was sich lohnt."
  - titel: "Wie viel Zeit kostet uns das?"
    text: "Wenig. Wir brauchen Stichpunkte, Fotos und ein, zwei Gespräche. Texte und Technik übernehmen wir."

